<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Max Zhaoshuo Li's Blog Posts.">

	<title>Blog - Max Li 李赵硕</title>

	<!-- Favicon -->
	<link rel="icon" type="image/x-icon" href="../media/favicon.ico">

	<!-- Bootstrap core CSS -->
	<link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

	<!-- JQuery -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<!-- Custom fonts for this template -->
	<script src="https://kit.fontawesome.com/d1a49f0666.js" crossorigin="anonymous"></script>
	<link href='https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic' rel='stylesheet'
		type='text/css'>
	<link
		href='https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800'
		rel='stylesheet' type='text/css'>

	<!-- Custom styles for this template -->
	<link href="../css/clean-blog.css" rel="stylesheet">
	<link href="../css/about-me.css" rel="stylesheet">
	<link href="blog.css" rel="stylesheet">
</head>

<body>
	<!-- Main Content -->
	<div class="wrapper">
		<div class="main-wrapper">
			<!-- Blog Section -->
			<section class="section-blog">
				<h2 class="section-title">
					<span class="fa-stack fa-xs">
						<i class="fas fa-circle fa-stack-2x"></i>
						<i class="fas fa-pen-nib fa-stack-1x fa-inverse"></i>
					</span>
					Max's Jotting
				</h2>

				<!-- Loading State -->
				<div id="loading" class="loading-state">
					<div class="loading-spinner">
						<i class="fas fa-spinner fa-spin"></i>
					</div>
					<p>Loading latest posts...</p>
				</div>

				<!-- Blog Posts -->
				<div id="blog-posts" class="posts-grid" style="display: none;">
					<!-- Blog posts will be loaded here -->
				</div>

				<!-- Empty State -->
				<div id="empty-state" class="empty-state" style="display: none;">
					<div class="empty-state-icon">
						<i class="fas fa-newspaper"></i>
					</div>
					<h3>No posts yet</h3>
					<p>New insights and research updates will appear here soon.</p>
				</div>

				<!-- Error State -->
				<div id="error" class="error-state" style="display: none;">
					<div class="empty-state-icon">
						<i class="fas fa-exclamation-triangle"></i>
					</div>
					<h3>Unable to load posts</h3>
					<p>Please try refreshing the page or check back later.</p>
				</div>
			</section>
		</div>

		<div id="profile-bar"></div>
		<div id="footer"></div>

	<!-- Blog JavaScript -->
	<script src="blog.js"></script>
	<script>
		$(function () {
			// Load sidebar and footer
			$("#profile-bar").load("../content/profile-bar.html");
			$("#footer").load("../content/footer.html");
			
			// List of blog post filenames - add new posts here
			const blogFiles = [
				'ai-research-insights.md',
				'welcome-to-my-blog.md'
				// Add more blog post filenames here as you create them
			];
			
			BlogManager.initializeBlogListing(blogFiles);
		});
	</script>
</body>

</html>
