<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Max Zhaoshuo Li's Blog Post.">

	<title id="page-title">Blog Post - Max Li 李赵硕</title>

	<!-- Favicon -->
	<link rel="icon" type="image/x-icon" href="../media/favicon.ico">

	<!-- Bootstrap core CSS -->
	<link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

	<!-- JQuery -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<!-- Markdown parser -->
	<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

	<!-- Custom fonts for this template -->
	<script src="https://kit.fontawesome.com/d1a49f0666.js" crossorigin="anonymous"></script>
	<link href='https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic' rel='stylesheet'
		type='text/css'>
	<link
		href='https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800'
		rel='stylesheet' type='text/css'>

	<!-- Custom styles for this template -->
	<link href="../css/clean-blog.css" rel="stylesheet">
	<link href="../css/about-me.css" rel="stylesheet">
	<link href="blog.css" rel="stylesheet">
</head>

<body>
	<!-- Main Content -->
	<div class="wrapper">
		<!-- Blog Post Header -->
	<header class="blog-post-header">
		<div class="blog-post-content">
			<h1 id="blog-title" class="blog-post-title"></h1>
			<div id="blog-meta" class="blog-post-meta"></div>
		</div>
	</header>

	<!-- Main Content -->
	<main class="blog-post-content">

		<!-- Loading State -->
		<div id="loading" class="loading-state">
			<div class="loading-spinner">
				<i class="fas fa-spinner fa-spin"></i>
			</div>
			<p>Loading blog post...</p>
		</div>

		<!-- Error State -->
		<div id="error" class="error-state" style="display: none;">
			<div class="empty-state-icon">
				<i class="fas fa-exclamation-triangle"></i>
			</div>
			<h3>Blog post not found</h3>
			<p>The requested blog post could not be loaded.</p>
		</div>

		<!-- Blog Content -->
		<article id="blog-content" style="display: none;">
			<div id="blog-body" class="blog-post-body">
				<!-- Blog content will be loaded here -->
			</div>
		</article>

	</main>

	<!-- Footer -->
	<div id="footer"></div>
</div>

	<!-- Blog JavaScript -->
	<script src="blog.js"></script>
	<script>
		$(document).ready(function() {
			// Load footer
			$("#footer").load("../content/footer.html");
			
			// Blog post metadata - keep this in sync with blog-listing.html
			const blogPostMetadata = {
				'qwen3-vl.html': {
					title: "Qwen3-VL: changes from Qwen2.5-VL",
					excerpt: "An early peek of what has changed",
					date: "2025-09-10"
				},
				// Add more blog post metadata here as you create them
			};
			
			// Get the post filename from URL parameter
			const urlParams = new URLSearchParams(window.location.search);
			const postFilename = urlParams.get('post');
			
			console.log('Blog post page loaded, post filename:', postFilename);
			console.log('Available metadata keys:', Object.keys(blogPostMetadata));
			console.log('Looking for metadata for:', postFilename);
			console.log('Metadata found:', blogPostMetadata[postFilename]);
			
			if (postFilename && blogPostMetadata[postFilename]) {
				const metadata = blogPostMetadata[postFilename];
				
				// Format date simply
				const formatDate = (dateString) => {
					try {
						const date = new Date(dateString);
						return date.toLocaleDateString('en-US', {
							year: 'numeric',
							month: 'long',
							day: 'numeric'
						});
					} catch (e) {
						return dateString;
					}
				};
				
				// Update page title and header
				document.title = `${metadata.title} - Max Li 李赵硕`;
				$('#blog-title').text(metadata.title);
				$('#blog-meta').text(formatDate(metadata.date));
				
				console.log('Updated blog post header:', metadata.title, formatDate(metadata.date));
				
				// Load the HTML content
				fetch(postFilename)
					.then(response => {
						if (!response.ok) {
							throw new Error(`HTTP error! status: ${response.status}`);
						}
						return response.text();
					})
					.then(html => {
						// Extract the content from the HTML (remove the Jekyll layout wrapper if any)
						const parser = new DOMParser();
						const doc = parser.parseFromString(html, 'text/html');
						const content = doc.body.innerHTML || html;
						
						$('#blog-body').html(content);
						$('#loading').hide();
						$('#blog-content').show();
					})
					.catch(error => {
						console.error(`Failed to load blog post ${postFilename}:`, error);
						$('#loading').hide();
						$('#error').show();
					});
			} else {
				console.error('Blog post not found or no metadata available. Post filename:', postFilename);
				document.title = 'Blog Post Not Found - Max Li 李赵硕';
				$('#blog-title').text('Blog Post Not Found');
				$('#blog-meta').text('');
				$('#loading').hide();
				$('#error').show();
			}
		});
	</script>
</body>

</html>
