            // { date: '11.11.2024', message: 'We released <a class="paper" href="https://arxiv.org/abs/2411.07135">Edify 3D</a>, technology for 3D generation!' },
            // { date: '08.16.2024', message: 'Our <a class="paper" href="https://research.nvidia.com/labs/toronto-ai/space-mesh/">SpaceMesh</a>, a continuous respresnetation for manifold meshes, is accepted by SIGGRAPH ASIA 2024!' },

            { date: '10.24.2023', message: 'Neuralangelo has been named as the <a class="paper" href="https://time.com/collection/best-inventions-2023/6324133/neuralangelo/">TIME\'s Best Inventions of 2023!</a>' },

        ];
        function generateTable(updates) {
            let tableContent = '<table style="width: auto;">';
            updates.forEach(update => {
            tableContent += `
                <tr>
                <td style="width:20%">
                    <div class="date">${update.date}</div>
                </td>
                <td>
                    ${update.message}
                </td>
                </tr>
            `;
            });
            tableContent += '</table>';
            return tableContent;
        }
        document.querySelector('.section-updates').insertAdjacentHTML('beforeend', generateTable(updates));
    </script>
</section>
