<!-- Updates -->
<section class="section-updates">
    <h2 class="section-title">
        <span class="fa-stack fa-xs">
            <i class="fas fa-circle fa-stack-2x"></i>
            <i class="fas fa-rss fa-stack-1x fa-inverse"></i>
        </span>
        Updates
    </h2>
    <script>
        const updates = [
            { date: '01.27.2026', message: '<a class="paper" href="https://research.nvidia.com/labs/dir/scenethesis/">Scenethesis</a>, an agentic framework for 3D scene generation, has been accepted by ICLR 2026!'},         
            { date: '12.07.2025', message: '<a class="paper" href="https://github.com/mli0603/openpi-comet">Open-pi Comet</a> won the 2nd place in the 2025 BEHAVIOR Challenge @ NeurIPS 2025!'},         
            { date: '10.28.2025', message: 'We released <a class="paper" href="https://research.nvidia.com/labs/dir/cosmos-predict2.5/">Cosmos Predict2.5</a>, an improved world foundation model platform for physical AI!'},     
            { date: '06.12.2025', message: '<a class="paper" href="https://research.nvidia.com/labs/dir/partpacker/">PartPacker</a>, 3D generation with parts has been accepted by NeurIPS 2025!'},     
            { date: '06.10.2025', message: 'We released <a class="paper" href="https://research.nvidia.com/labs/dir/cosmos-reason1/">Cosmos Reason1</a> -- now it is also a video critique model!'}, 
            // { date: '05.31.2025', message: '<a class="paper" href="https://research.nvidia.com/labs/dir/artiscene/">Artiscene</a>, a 3D scene generation framework, has been accepted by CVPR 2025!' },    
            // { date: '05.01.2025', message: '<a class="paper" href="https://research.nvidia.com/labs/dir/onedp/">OneDP</a>, a lighitng fast diffusion policy for robot manipulation, has been accepted by ICML 2025!' },    
            { date: '03.31.2025', message: '<a class="paper" href="https://cot-vla.github.io/">CoT-VLA</a>, an VLA model for robot control with visual chain-of-thought reasoning, has been accepted by CVPR 2025!'},     
            // { date: '02.07.2025', message: '<a class="paper" href="https://research.nvidia.com/labs/dir/edgerunner/">EdgeRunner</a>, an auto-regressive model for artistic mesh creation, has been accepted by ICLR 2025!' }, 
            { date: '01.06.2025', message: 'We released <a class="paper" href="https://research.nvidia.com/labs/dir/cosmos-predict1/">Cosmos Predict1</a>, a world foundation model platform for physical AI!' },    
            // { date: '11.11.2024', message: 'We released <a class="paper" href="https://arxiv.org/abs/2411.07135">Edify 3D</a>, technology for 3D generation!' },
            // { date: '08.16.2024', message: 'Our <a class="paper" href="https://research.nvidia.com/labs/toronto-ai/space-mesh/">SpaceMesh</a>, a continuous respresnetation for manifold meshes, is accepted by SIGGRAPH ASIA 2024!' },
            // { date: '07.30.2024', message: 'GenUSD was featured in <a class="paper" href="https://blogs.nvidia.com/blog/real-time-3d-generative-ai-research-siggraph-2024/?ncid=so-twit-353134-vt36&linkId=100000277255797"> Real Time Live! at SIGGRAPH 2024!</a>' },
            { date: '10.24.2023', message: 'Neuralangelo has been named as the <a class="paper" href="https://time.com/collection/best-inventions-2023/6324133/neuralangelo/">TIME\'s Best Inventions of 2023!</a>' },
            // { date: '07.30.2021', message: '<a class="paper" href="https://github.com/mli0603/stereo-transformer">STTR</a> accepted at ICCV 2021 as an <span class="award">Oral Paper</span>!' }
        ];
        
        function generateTimeline(updates) {
            let content = '<div class="timeline">';
            updates.forEach(update => {
                content += `
                    <div class="timeline-item">
                        <div class="timeline-marker"></div>
                        <div class="timeline-content">
                            <span class="timeline-date">${update.date}</span>
                            <p class="timeline-message">${update.message}</p>
                        </div>
                    </div>
                `;
            });
            content += '</div>';
            return content;
        }
        
        document.querySelector('.section-updates').insertAdjacentHTML('beforeend', generateTimeline(updates));
    </script>
    
    <style>
        .timeline {
            position: relative;
            padding-left: 24px;
            margin-left: 8px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: linear-gradient(to bottom, #0085A1, #b3d9e3);
            border-radius: 3px;
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        
        .timeline-item:last-child {
            padding-bottom: 0;
        }
        
        .timeline-marker {
            position: absolute;
            left: -24px;
            top: 6px;
            width: 11px;
            height: 11px;
            background: #0085A1;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 3px #e8f4f8;
        }
        
        .timeline-content {
            padding-left: 8px;
        }
        
        .timeline-date {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0085A1;
            background: #e8f4f8;
            padding: 2px 10px;
            border-radius: 12px;
            margin-bottom: 6px;
        }
        
        .timeline-message {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #333;
        }
        
        .timeline-message a.paper {
            color: rgb(6, 67, 117);
            font-weight: 500;
        }
        
        .timeline-message a.paper:hover {
            text-decoration: underline;
        }
    </style>
</section>
